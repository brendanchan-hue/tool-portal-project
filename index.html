<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EE Tool Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-name" href="index.html">EE Tool Portal</a>
      <button class="theme-toggle" type="button" aria-pressed="false">Dark theme</button>
    </div>
  </header>

  <main class="container">
    <h1>Electrical Engineering tools</h1>
    <p class="intro">Small tools to help you practise and check your work. Pick a tool to open it.</p>

    <!-- To add a tool: create tools/<tool-name>.html and add one <li> card here. -->
    <ul class="tool-grid">
      <li>
        <a class="tool-card" href="tools/ohms-law.html">
          <h2>Ohm's Law Calculator</h2>
          <p>Enter any two of voltage, current, resistance and power, and see the other two worked out step by step.</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
